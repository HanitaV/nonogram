<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Chơi, giải, tạo và chia sẻ câu đố nonogram ngay trong trình duyệt, với bộ giải hiển thị từng bước." />
    <meta name="theme-color" content="#14284F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1325" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="./hamic.png" />
    <title>Nonogram Studio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('nonogram-studio') || '{}');
        var t = s && s.settings && s.settings.theme;
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Nonogram Studio cần JavaScript để chạy các câu đố.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
